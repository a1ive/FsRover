name: Linux Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Linux x64
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            cmake \
            g++ \
            libfuse3-dev \
            pkg-config

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Configure
        run: cmake -S . -B build/linux -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/linux --parallel

      - name: Smoke test
        run: build/linux/LinuxRover --help

      - name: Product regression
        run: ctest --test-dir build/linux --verbose

      - name: Upload failed product regression
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: product-regression-linux-x64
          path: build/linux/product-tests/
          if-no-files-found: ignore
